# Run the integration tests against the supported MonetDB release
name: Integration tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
jobs:

  monetdb_version:
    name: MonetDB Dec2025-SP4
    runs-on: ubuntu-24.04-arm
    container: python:3.13
    env:
      CI_SERVER_URL: monetdb://monetdb/monetdb
    services:
      monetdb:
        image: wlaur/monetdb-container:11.55.9-1@sha256:b7238498164cd26a0b7bd9391d51948dca5c69f490f888186d3204320abaecf7
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: monetdb
        options: >-
          --tmpfs /var/monetdb5/dbfarm:rw,size=2147483648,mode=0777
        ports:
        - 50000:50000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Wait for MonetDB to accept connections
        run: |
          python - <<'PY'
          import socket
          import time

          last = "server closed the connection without a challenge"
          for attempt in range(60):
              try:
                  with socket.create_connection(("monetdb", 50000), timeout=2) as connection:
                      connection.settimeout(2)
                      if connection.recv(2):
                          print(f"MonetDB ready after {attempt + 1} attempts")
                          break
              except OSError as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"MonetDB never became ready: {last}")
          PY

      - run: cargo test --test ci --features ci-tests
      - run: cargo test --test ci --no-default-features --features ci-tests
      - run: cargo test --test ci --all-features
